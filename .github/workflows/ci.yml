name: CI

on:
  push:
    branches: [main, copilot/replace-css-with-unocss]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Build, types, tests, format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install verified Crepus emitter
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0
          curl --fail --location --retry 3 \
            https://github.com/softwarecorporation/crepuscularity/releases/download/v0.16.5/crepus-x86_64-linux \
            --output "$RUNNER_TEMP/crepus"
          echo "c04560674e122ebe78bd85ed917bbfc1fc263ec0394672b8474c63fbdf6cf4d8  $RUNNER_TEMP/crepus" | sha256sum --check
          chmod +x "$RUNNER_TEMP/crepus"
          echo "CREPUS_BIN=$RUNNER_TEMP/crepus" >> "$GITHUB_ENV"
      - name: Build
        run: bun run build
      - name: Check types
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Check formatting
        run: bun run format
      - name: Lint
        run: bun run lint
      - name: Check Cupboard content
        run: bun scripts/check-cupboard.ts
      - name: Check generated source is current
        run: git diff --exit-code
